apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
# The installer stages this checksum-verified upstream file beside the overlay.
resources: [core-install-v3.6.1.yaml]
images:
  - name: quay.io/argoproj/argocd
    newName: quay.io/argoproj/argocd
    digest: sha256:296e3d74f449b2ce45265613fcb68c18ed7366488360c8ea32f5f2a93d2e5c54
  - name: public.ecr.aws/docker/library/redis
    newName: docker.io/library/redis
    digest: sha256:ef216d85ec44f4fdf7c0e6df2d1757a4734ed32fbb278cabd3181b5a27353b79
patches:
  - target:
      kind: Deployment
      name: argocd-applicationset-controller
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-applicationset-controller
  - target:
      kind: StatefulSet
      name: argocd-application-controller
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: argocd-application-controller
      spec:
        template:
          spec:
            containers:
              - name: argocd-application-controller
                resources:
                  requests: {cpu: 50m, memory: 128Mi}
                  limits: {cpu: 500m, memory: 384Mi}
  - target:
      kind: Deployment
      name: argocd-repo-server
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-repo-server
      spec:
        template:
          spec:
            containers:
              - name: argocd-repo-server
                resources:
                  requests: {cpu: 25m, memory: 64Mi}
                  limits: {cpu: 300m, memory: 256Mi}
  - target:
      kind: Deployment
      name: argocd-redis
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-redis
      spec:
        template:
          spec:
            containers:
              - name: redis
                resources:
                  requests: {cpu: 10m, memory: 32Mi}
                  limits: {cpu: 100m, memory: 96Mi}
  - target:
      kind: ConfigMap
      name: argocd-cmd-params-cm
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-cmd-params-cm
      data:
        controller.status.processors: "2"
        controller.operation.processors: "1"
        reposerver.parallelism.limit: "1"
  - target:
      kind: ConfigMap
      name: argocd-cm
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-cm
      data:
        application.resourceTrackingMethod: annotation

- name: Configure kubelet serving certificate requests
  ansible.builtin.import_playbook: kubelet-serving.yml
  tags: [metrics]

- name: Configure the Kubernetes platform from the controller
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files: [vars.yml]
  environment:
    HELM_PLUGINS: "{{ state_dir }}/helm-plugins"
    # Server dry-run lets chart lookup reuse existing TLS Secrets.
    HELM_DIFF_USE_UPGRADE_DRY_RUN: "true"
  module_defaults:
    group/kubernetes.core.k8s:
      kubeconfig: "{{ kubeconfig }}"
    kubernetes.core.helm:
      kubeconfig: "{{ kubeconfig }}"
      wait: true
      atomic: true
      timeout: 600s
      reset_values: true
      history_max: 5
  roles:
    - platform

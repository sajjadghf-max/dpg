- name: Download checksum-verified validation tools
  ansible.builtin.get_url:
    url: '{{ item.url }}'
    dest: '{{ state_dir }}/downloads/{{ item.name }}.tar.gz'
    checksum: '{{ item.checksum }}'
    mode: '0600'
  loop: '{{ validation_tools }}'
  loop_control:
    label: '{{ item.name }}'

- name: Extract tool archives
  ansible.builtin.unarchive:
    src: '{{ state_dir }}/downloads/{{ item.name }}.tar.gz'
    dest: '{{ state_dir }}/downloads'
  loop: '{{ validation_tools }}'
  loop_control:
    label: '{{ item.name }}'

- name: Install pinned Helm in the project tool directory
  ansible.builtin.copy:
    src: '{{ state_dir }}/downloads/linux-amd64/helm'
    dest: '{{ state_dir }}/bin/helm'
    mode: '0755'

- name: Install pinned kubeconform in the project tool directory
  ansible.builtin.copy:
    src: '{{ state_dir }}/downloads/kubeconform'
    dest: '{{ state_dir }}/bin/kubeconform'
    mode: '0755'

- name: Download checksum-verified kubectl for offline rendering
  ansible.builtin.get_url:
    url: https://dl.k8s.io/release/v1.36.4/bin/linux/amd64/kubectl
    dest: '{{ state_dir }}/bin/kubectl'
    checksum: sha256:8b8f088da2dab964f853b38464033b1be15ede2839eca751482357c45abdd05a
    mode: '0755'

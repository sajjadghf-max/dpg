- name: Verify HTTPS, real IP and ingress boundaries
  ansible.builtin.import_tasks: check-ingress.yml
  tags: [ingress]
- name: Verify application NetworkPolicies
  ansible.builtin.import_tasks: check-app.yml
  tags: [app]
- name: Verify monitoring and Grafana authentication
  ansible.builtin.import_tasks: check-monitoring.yml

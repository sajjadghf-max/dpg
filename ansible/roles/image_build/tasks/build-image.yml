- name: Read previous local image ID
  ansible.builtin.command:
    argv: [docker, image, inspect, "dpg-{{ component }}:lab", --format, '{{ "{{.Id}}" }}']
  register: previous_image
  changed_when: false
  failed_when: false

- name: Build the pinned application image
  ansible.builtin.command:
    argv: [docker, build, --provenance=false, --tag, "dpg-{{ component }}:lab", "{{ project_dir }}/app/{{ component }}"]
  changed_when: false

- name: Read built image content ID
  ansible.builtin.command:
    argv: [docker, image, inspect, "dpg-{{ component }}:lab", --format, '{{ "{{.Id}}" }}']
  register: built_image
  changed_when: built_image.stdout != previous_image.stdout

- name: Attach immutable content tag
  ansible.builtin.command:
    argv: [docker, tag, "dpg-{{ component }}:lab", "dpg-{{ component }}:sha-{{ built_image.stdout | regex_replace('^sha256:', '') }}"]
  changed_when: false

- name: Collect image settings
  ansible.builtin.set_fact:
    built_images: "{{ built_images | default({}) | combine({component: {'image': 'dpg-' ~ component ~ ':sha-' ~ (built_image.stdout | regex_replace('^sha256:', ''))}}) }}"

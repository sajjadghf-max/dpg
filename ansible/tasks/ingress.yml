- name: Ensure the application namespace exists
  kubernetes.core.k8s:
    definition:
      apiVersion: v1
      kind: Namespace
      metadata: {name: dpg-app}

- name: Maintain app certificate and Secret
  ansible.builtin.include_tasks: tls.yml
  vars: {tls_name: app, tls_namespace: dpg-app}

- name: Fetch Traefik chart
  ansible.builtin.include_tasks: chart.yml
  vars: {chart_name: ingress}

- name: Detect monitoring CRDs
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: servicemonitors.monitoring.coreos.com
  register: monitoring_crd

- name: Reconcile Traefik preserving existing metrics configuration
  kubernetes.core.helm:
    name: traefik
    chart_ref: "{{ state_dir }}/charts/{{ charts.ingress.file }}"
    release_namespace: ingress-system
    create_namespace: true
    skip_crds: true
    values_files: "{{ [project_dir ~ '/platform/traefik/values.yaml'] + ([project_dir ~ '/platform/monitoring/traefik-values.yaml'] if monitoring_crd.resources | length > 0 else []) }}"

- name: Apply ingress network policy
  kubernetes.core.k8s:
    src: "{{ project_dir }}/platform/traefik/networkpolicy.yaml"

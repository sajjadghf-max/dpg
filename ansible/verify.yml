- name: Verify host hardening
  ansible.builtin.import_playbook: check-hardening.yml
  tags: [hardening]

- name: Verify the running lab
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files: [vars.yml]
  module_defaults:
    group/kubernetes.core.k8s:
      kubeconfig: "{{ kubeconfig }}"
    kubernetes.core.k8s_exec:
      kubeconfig: "{{ kubeconfig }}"
  roles:
    - verification

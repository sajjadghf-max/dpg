- name: Harden lab hosts without replacing Kubernetes firewall rules
  hosts: all
  become: true
  serial: 1
  gather_facts: false
  tasks:
    - name: Read available services
      ansible.builtin.service_facts:

    - name: Disable unused modem, VMware guest and crash-report services
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: stopped
        enabled: false
        masked: true
      loop:
        - ModemManager.service
        - open-vm-tools.service
        - vgauth.service
        - apport.service
        - apport-autoreport.path
        - apport-forward.socket
      when: item in ansible_facts.services or item.endswith('.path') or item.endswith('.socket')

    - name: Require SSH keys and retain the Vagrant provisioner account
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/00-dpg-hardening.conf
        owner: root
        group: root
        mode: "0600"
        content: |
          PermitRootLogin no
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PubkeyAuthentication yes
          AuthenticationMethods publickey
          AllowUsers vagrant
          X11Forwarding no
          AllowAgentForwarding no
          MaxAuthTries 3
      notify: Reload SSH

    - name: Validate complete SSH configuration
      ansible.builtin.command: /usr/sbin/sshd -t
      changed_when: false

    - name: Write independent host input rules
      ansible.builtin.template:
        src: templates/host-firewall.nft.j2
        dest: /etc/dpg-host-firewall.nft
        owner: root
        group: root
        mode: "0600"
        validate: /usr/sbin/nft --check --file %s
      notify: Apply host firewall

    - name: Install firewall boot unit without global ruleset flushing
      ansible.builtin.copy:
        dest: /etc/systemd/system/dpg-host-firewall.service
        mode: "0644"
        content: |
          [Unit]
          Description=DPG host input firewall
          After=network-pre.target
          Before=network.target
          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/usr/sbin/nft --file /etc/dpg-host-firewall.nft
          ExecReload=/usr/sbin/nft --file /etc/dpg-host-firewall.nft
          [Install]
          WantedBy=multi-user.target

    - name: Enable host firewall
      ansible.builtin.systemd_service:
        name: dpg-host-firewall
        daemon_reload: true
        enabled: true
        state: started

    - name: Apply validated changes
      ansible.builtin.meta: flush_handlers

    - name: Reconnect to verify SSH access
      ansible.builtin.meta: reset_connection

    - name: Verify fresh SSH connection
      ansible.builtin.ping:

  handlers:
    - name: Reload SSH
      ansible.builtin.systemd_service:
        name: ssh
        state: reloaded

    - name: Apply host firewall
      ansible.builtin.systemd_service:
        name: dpg-host-firewall
        state: reloaded

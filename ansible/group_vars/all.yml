# Shared project settings. Default to verification; installation is explicit.
lab_phase: verify
# Controller-side paths; VM inventory remains in inventory/lab.
project_dir: "{{ ansible_config_file | dirname }}"
state_dir: "{{ project_dir }}/.state"
kubeconfig: "{{ state_dir }}/artifacts/admin.conf"
kubectl: "{{ state_dir }}/artifacts/kubectl"
git_ca_file: "{{ lookup('env', 'GIT_CA_FILE') }}"
charts:
  metrics:
    file: metrics-server-3.14.0.tgz
    url: https://github.com/kubernetes-sigs/metrics-server/releases/download/metrics-server-helm-chart-3.14.0/metrics-server-3.14.0.tgz

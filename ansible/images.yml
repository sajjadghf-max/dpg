- name: Build and export content-addressed application images
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files: [vars.yml]
  tasks:
    - name: Create private image archive directory
      ansible.builtin.file:
        path: "{{ state_dir }}/images"
        state: directory
        mode: "0700"

    - name: Build each component and read its content ID
      ansible.builtin.include_tasks: tasks/build-image.yml
      loop: [php, nginx]
      loop_control: {loop_var: component}

    - name: Save image settings for application bootstrap
      ansible.builtin.copy:
        dest: "{{ state_dir }}/app-images.json"
        content: "{{ built_images | to_nice_json }}\n"
        mode: "0600"

    - name: Inspect current archive identity
      ansible.builtin.stat:
        path: "{{ state_dir }}/images/{{ built_images | to_json | hash('sha256') }}.tar"
      register: image_archive

    - name: Export a new archive only when image content changed
      ansible.builtin.command:
        argv: [docker, image, save, --platform, linux/amd64, --output, "{{ state_dir }}/images/{{ built_images | to_json | hash('sha256') }}.tar", "{{ built_images.php.image }}", "{{ built_images.nginx.image }}"]
      when: not image_archive.stat.exists
      changed_when: true

    - name: Restrict archive permissions
      ansible.builtin.file:
        path: "{{ state_dir }}/images/{{ built_images | to_json | hash('sha256') }}.tar"
        mode: "0600"

    - name: Record archive path for the worker play
      ansible.builtin.set_fact:
        app_archive: "{{ state_dir }}/images/{{ built_images | to_json | hash('sha256') }}.tar"

- name: Import images on each worker
  hosts: kube_node
  become: true
  gather_facts: false
  tasks:
    - name: Read worker image names
      ansible.builtin.command: /usr/local/bin/ctr --namespace k8s.io images list -q
      register: worker_images
      changed_when: false

    - name: Import missing application images
      when: "force_image_import | default(false) | bool or ('docker.io/library/' ~ hostvars['localhost'].built_images.php.image) not in worker_images.stdout_lines or ('docker.io/library/' ~ hostvars['localhost'].built_images.nginx.image) not in worker_images.stdout_lines"
      block:
        - name: Copy content-addressed archive
          ansible.builtin.copy:
            src: "{{ hostvars['localhost'].app_archive }}"
            dest: /var/tmp/dpg-app-images.tar
            mode: "0600"
        - name: Import images without remote transfer-service contention
          ansible.builtin.command:
            argv: [/usr/local/bin/ctr, --namespace, k8s.io, images, import, --local, --platform, linux/amd64, /var/tmp/dpg-app-images.tar]
          changed_when: true
        - name: Confirm both imported names are available
          ansible.builtin.command: /usr/local/bin/ctr --namespace k8s.io images list -q
          register: imported_images
          changed_when: false
          failed_when: "('docker.io/library/' ~ hostvars['localhost'].built_images.php.image) not in imported_images.stdout_lines or ('docker.io/library/' ~ hostvars['localhost'].built_images.nginx.image) not in imported_images.stdout_lines"

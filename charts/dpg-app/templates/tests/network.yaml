{{- range $mode := list "allowed" "denied" }}
---
apiVersion: v1
kind: Pod
metadata:
  name: {{ $.Release.Name }}-test-{{ $mode }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
  labels:
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: {{ if eq $mode "allowed" }}smoke-test{{ else }}denied-client{{ end }}
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: test
      image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL]}
      resources:
        requests: {cpu: 10m, memory: 8Mi}
        limits: {cpu: 100m, memory: 32Mi}
      command:
        - sh
        - -ec
        - |
          nslookup {{ $.Release.Name }}-nginx.{{ $.Release.Namespace }}.svc.cluster.local.
          {{- if eq $mode "allowed" }}
          test "$(wget -qO- -T 5 http://{{ $.Release.Name }}-nginx/healthz)" = ok
          test "$(wget -qO- -T 5 http://{{ $.Release.Name }}-nginx/readyz)" = ready
          wget -qO- -T 5 http://{{ $.Release.Name }}-nginx/ | grep '"service":"digipay-sre-lab"'
          {{- else }}
          if nc -z -w 3 {{ $.Release.Name }}-nginx 80; then
            echo 'FAIL: unauthorized client reached NGINX'; exit 1
          fi
          {{- end }}
          if nc -z -w 3 {{ $.Release.Name }}-php 9000; then
            echo 'FAIL: client reached PHP directly'; exit 1
          fi
          echo 'PASS: {{ $mode }} client network checks'
{{- end }}

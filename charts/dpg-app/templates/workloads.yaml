{{- range $component := list "php" "nginx" }}
{{- $settings := index $.Values $component }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $component }}
spec:
  {{- if not $.Values.autoscaling.enabled }}
  replicas: {{ $settings.replicas }}
  {{- end }}
  revisionHistoryLimit: 2
  minReadySeconds: 5
  strategy:
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $component }}
  template:
    metadata:
      {{- if eq $component "nginx" }}
      annotations:
        checksum/proxies: {{ include (print $.Template.BasePath "/trusted-proxies.yaml") $ | sha256sum }}
      {{- end }}
      labels:
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: {{ $component }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ if eq $component "php" }}82{{ else }}101{{ end }}
        runAsGroup: {{ if eq $component "php" }}82{{ else }}101{{ end }}
        fsGroup: {{ if eq $component "php" }}82{{ else }}101{{ end }}
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          matchLabelKeys: [pod-template-hash]
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $.Release.Name }}
              app.kubernetes.io/component: {{ $component }}
      containers:
        - name: {{ $component }}
          image: {{ $settings.image | quote }}
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            {{- toYaml $settings.resources | nindent 12 }}
          {{- if eq $component "nginx" }}
          env:
            - {name: PHP_FPM_UPSTREAM, value: "{{ $.Release.Name }}-php:9000"}
            - {name: FPM_STATUS_UPSTREAM, value: "{{ $.Release.Name }}-php:9001"}
          ports:
            - {name: http, containerPort: 8080}
            - {name: status, containerPort: 8081}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            timeoutSeconds: 3
            periodSeconds: 5
          {{- else }}
          ports:
            - {name: fastcgi, containerPort: 9000}
            - {name: status, containerPort: 9001}
          startupProbe:
            tcpSocket: {port: fastcgi}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            tcpSocket: {port: fastcgi}
            periodSeconds: 10
          readinessProbe:
            exec: {command: [php, /usr/local/bin/ready.php]}
            timeoutSeconds: 3
            periodSeconds: 5
          {{- end }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            {{- if eq $component "nginx" }}
            - name: trusted-proxies
              mountPath: /etc/nginx/trusted-proxies.conf
              subPath: trusted-proxies.conf
              readOnly: true
            {{- end }}
        {{- if $.Values.monitoring.enabled }}
        {{- $exporter := index $.Values.monitoring.exporters $component }}
        - name: exporter
          image: {{ $exporter.image | quote }}
          imagePullPolicy: IfNotPresent
          args: {{ $exporter.args | toJson }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          ports:
            - {name: metrics, containerPort: {{ $exporter.port }}}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          readinessProbe:
            httpGet: {path: /metrics, port: metrics}
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /metrics, port: metrics}
            timeoutSeconds: 3
        {{- end }}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
        {{- if eq $component "nginx" }}
        - name: trusted-proxies
          configMap:
            name: {{ $.Release.Name }}-trusted-proxies
        {{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $.Release.Name }}-{{ $component }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $component }}
{{- if $.Values.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $.Release.Name }}-{{ $component }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $.Release.Name }}-{{ $component }}
  minReplicas: {{ $.Values.autoscaling.minReplicas }}
  maxReplicas: {{ $.Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $.Values.autoscaling.targetCPUUtilizationPercentage }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
{{- end }}
{{- end }}

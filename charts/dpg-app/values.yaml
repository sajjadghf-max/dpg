nginx:
  image: dpg-nginx:lab
  replicas: 2
  resources:
    requests: {cpu: 50m, memory: 16Mi}
    limits: {cpu: 250m, memory: 64Mi}
  # Set to the ingress controller's namespace/pod selectors when adding ingress.
  ingressFrom:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: ingress-system}
      podSelector:
        matchLabels: {app.kubernetes.io/name: traefik}
  # NetworkPolicy restricts peers within this CIDR to the ingress controller.
  trustedProxyCIDRs: [10.233.64.0/18]
php:
  image: dpg-php:lab
  replicas: 2
  resources:
    requests: {cpu: 100m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
imagePullPolicy: Never
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
dnsServers:
  - 169.254.25.10/32
  - 10.233.0.3/32
ingress:
  enabled: true
  className: traefik
  host: app.dpg.test
  tlsSecret: app-tls
monitoring:
  enabled: false
  release: monitoring
  exporters:
    nginx:
      image: docker.io/nginx/nginx-prometheus-exporter@sha256:85666e7fde7e253f1c6d978f9a961245df4c9cdb7677e1866d9bb28e8f9ee41d
      port: 9113
      args: [--nginx.scrape-uri=http://127.0.0.1:8081/nginx-status]
    php:
      image: docker.io/hipages/php-fpm_exporter@sha256:9b5be9d3d9551e5f0155988dd799c55d6a5c08d1ce47218fccd1b030cfdd3447
      port: 9253
      args: [server, --phpfpm.scrape-uri=tcp://127.0.0.1:9001/fpm-status]
